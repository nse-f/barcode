<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Barcode Generator – Night Star Express</title>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <style>
    :root {
      --ci-blue: #003366;
      --ci-light: #e9f1f9;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: var(--ci-light);
      color: var(--ci-blue);
      margin: 0;
      padding: 0;
      text-align: center;
    }

    header {
      background-color: var(--ci-blue);
      padding: 20px;
    }

    header img {
      max-height: 80px;
    }

    main {
      padding: 40px 20px;
    }

    h1 {
      margin-bottom: 10px;
    }

    input {
      width: 80%;
      max-width: 400px;
      padding: 12px;
      font-size: 18px;
      border: 2px solid var(--ci-blue);
      border-radius: 8px;
      margin-top: 20px;
      color: var(--ci-blue);
    }

    button {
      margin-top: 30px;
      padding: 10px 20px;
      font-size: 16px;
      background-color: var(--ci-blue);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    #barcode {
      margin-top: 40px;
      background-color: white;
      padding: 10px;
      border: 1px solid #ccc;
    }

    @media print {
      body * {
        visibility: hidden;
      }
      #barcode, #barcode * {
        visibility: visible;
      }
      #barcode {
        position: absolute;
        top: 0;
        left: 0;
        margin: 0 auto;
        width: 100%;
        text-align: center;
      }
    }
  </style>
</head>
<body>

  <header>
    <img src="e957d8b4-7021-4aaa-b92f-9156666f5167.jpg" alt="Night Star Express Logo">
  </header>

  <main>
    <h1>Barcode Generator</h1>
    <p>Gib einen Text ein – der Barcode wird automatisch angezeigt:</p>

    <input type="text" id="barcodeInput" placeholder="z.B. hfdpofäpo+ßo12" oninput="generateBarcode()" />

    <svg id="barcode"></svg>

    <button onclick="window.print()">Drucken</button>
  </main>

  <script>
    function generateBarcode() {
      const input = document.getElementById("barcodeInput").value;
      const svg = document.getElementById("barcode");

      if (input.trim() === "") {
        svg.innerHTML = "";
        return;
      }

      try {
        JsBarcode("#barcode", input, {
          format: "CODE128",
          displayValue: true,
          fontSize: 18,
          lineColor: "#000",
          width: 2,
          height: 100,
          margin: 10
        });
      } catch (e) {
        svg.innerHTML = "";
      }
    }
  </script>

</body>
</html>
