<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Barcode Generator – Night Star Express</title>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <style>
    :root {
      --ci-blue: #003366;
      --ci-light: #e9f1f9;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: var(--ci-light);
      color: var(--ci-blue);
      margin: 0;
      padding: 0;
      text-align: center;
    }

    header {
      background-color: var(--ci-blue);
      padding: 20px;
    }

    header img {
      max-height: 80px;
    }

    main {
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    input, textarea {
      width: 80%;
      max-width: 400px;
      padding: 12px;
      font-size: 18px;
      border: 2px solid var(--ci-blue);
      border-radius: 8px;
      color: var(--ci-blue);
    }

 textarea {
  font-family: Arial, sans-serif;
  font-size: 18px;
  font-weight: bold
  height: 100px;
  resize: vertical;
  text-align:center;
}

    button {
      padding: 10px 20px;
      font-size: 16px;
      background-color: var(--ci-blue);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
    }

    #barcode {
      margin-top: 20px;
      background-color: white;
      padding: 10px;
      border: 1px solid #ccc;
    }

    .button-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    @media print {
      body * {
        visibility: hidden;
      }

      #printSection, #printSection * {
        visibility: visible;
      }

      #printSection {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        padding: 20px;
        text-align: center;
      }
    }
  </style>
</head>
<body>

  <header>
    <img src="https://raw.githubusercontent.com/nse-f/barcode/main/logo-nse.svg" alt="Night Star Express Logo">
  </header>

  <main>
    <h1>Barcode Generator Night Star Express Frankfurt</h1>
    <p>Barcode-Text:</p>

    <input type="text" id="barcodeInput" placeholder="code" oninput="generateBarcode()" />

    <div id="printSection">
      <svg id="barcode"></svg>
      <textarea id="manualNote" placeholder="Zusätzlicher Text / Beschreibung"></textarea>
    </div>

    <div class="button-group">
      <button onclick="window.print()">Drucken</button>
      <button onclick="copyBarcodeImage()">Barcode kopieren</button>
    </div>
  </main>

  <script>
    function generateBarcode() {
      const input = document.getElementById("barcodeInput").value;
      const svg = document.getElementById("barcode");

      if (input.trim() === "") {
        svg.innerHTML = "";
        return;
      }

      try {
        JsBarcode("#barcode", input, {
          format: "CODE128",
          displayValue: true,
          fontSize: 18,
          lineColor: "#000",
          width: 2,
          height: 100,
          margin: 10
        });
      } catch (e) {
        svg.innerHTML = "";
      }
    }

    async function copyBarcodeImage() {
      const svg = document.getElementById("barcode");
      const serializer = new XMLSerializer();
      const svgString = serializer.serializeToString(svg);

      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");

      const img = new Image();
      const svgBlob = new Blob([svgString], { type: "image/svg+xml;charset=utf-8" });
      const url = URL.createObjectURL(svgBlob);

      img.onload = async function () {
        canvas.width = img.width;
        canvas.height = img.height;
        ctx.drawImage(img, 0, 0);
        URL.revokeObjectURL(url);

        canvas.toBlob(async function (blob) {
          try {
            await navigator.clipboard.write([
              new ClipboardItem({ "image/png": blob })
            ]);
            alert("Barcode erfolgreich kopiert!");
          } catch (err) {
            alert("Fehler beim Kopieren: " + err);
          }
        }, "image/png");
      };

      img.src = url;
    }
  </script>

</body>
</html>
